<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman PvP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="playerUI left">
    <div>❤️ <span id="hp1">100</span></div>
    <div>⚡ <span id="charge1">0</span></div>
  </div>

  <div class="playerUI right">
    <div>❤️ <span id="hp2">100</span></div>
    <div>⚡ <span id="charge2">0</span></div>
  </div>
</div>

<div id="abilities" class="hidden">
  <button onclick="useAbility('beam')">BEAM</button>
  <button onclick="useAbility('stun')">STUN</button>
  <button onclick="useAbility('heal')">HEAL</button>
</div>

<script src="script.js"></script>
</body>
</html>
